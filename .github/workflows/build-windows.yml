name: Build WildGram Desktop (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/scripts/**'

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Prepare directories
        shell: cmd
        run: |
          mkdir "%userprofile%\TBuild\Libraries" 2>nul
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%userprofile%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: ${{ env.TBUILD }}\WildGram

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Libraries Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.LibrariesPath }}
          key: win2022-x64-libs-${{ hashFiles('**/prepare.py') }}
          restore-keys: |
            win2022-x64-libs-

      - name: Prepare Third-Party Libraries
        shell: cmd
        run: |
          cd "%TBUILD%\WildGram"
          call Telegram\build\prepare\win.bat skip-release silent

      - name: Save Libraries Cache (Explicit)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.LibrariesPath }}
          key: win2022-x64-libs-${{ hashFiles('**/prepare.py') }}

      - name: Apply CMake MSVC Patches
        shell: pwsh
        run: |
          cd "$env:TBUILD\WildGram"
          $diff = @"
          diff --git a/variables.cmake b/variables.cmake
          index a1e77b7..9f816cb 100644
          --- a/variables.cmake
          +++ b/variables.cmake
          @@ -28,4 +28,4 @@ set(CMAKE_CXX_SCAN_FOR_MODULES OFF CACHE BOOL "")
           set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT
          -    "`$<$<CONFIG:Debug>:ProgramDatabase>`$<$<NOT:`$<CONFIG:Debug>>:Embedded>"
          -    CACHE STRING "")
          +    "`$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>`$<$<CONFIG:Release,MinSizeRel>:Embedded>"
          +    CACHE STRING "" FORCE)
           set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded`$<$<CONFIG:Debug>:Debug>" CACHE STRING "")
          "@
          $diff | git -C cmake apply -v --ignore-whitespace - || true

      - name: Configure CMake
        shell: cmd
        run: |
          cd "%TBUILD%\WildGram\Telegram"
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D CMAKE_CONFIGURATION_TYPES=Debug

      - name: Build WildGram
        shell: cmd
        run: |
          cd "%TBUILD%\WildGram"
          cmake --build out --config Debug --parallel

      - name: Find and Package Binary
        shell: pwsh
        run: |
          $outPath = Join-Path $env:TBUILD "WildGram\out\Debug"
          Write-Host "Checking binaries in: $outPath"
          Get-ChildItem -Path $outPath -Recurse -Filter "*.exe" | Select-Object FullName, Length

      - name: Upload WildGram Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildGram-Windows-x64
          path: |
            ${{ env.TBUILD }}/WildGram/out/Debug/*.exe
            ${{ env.TBUILD }}/WildGram/out/Debug/*.dll
